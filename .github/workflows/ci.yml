name: CI

on:
    push:
        branches:
            - main
            - production
        tags:
            - "v*"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: fusion-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: ${{ matrix.os }} / Rust stable / Node 24
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt,clippy

            - name: Configurar Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Validar proyecto
              run: npm run ci

            - name: Confirmar arbol reproducible
              shell: bash
              run: git diff --exit-code -- .
